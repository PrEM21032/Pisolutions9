name: PI Autonomous Cycle

on:
  workflow_dispatch:
    inputs:
      objective:
        description: 'Owner objective for this PI cycle'
        required: false
        default: 'Run a safe PI runtime health cycle'
        type: string
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read

concurrency:
  group: pi-autonomous-cycle
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PI
        uses: actions/checkout@v5
      - name: Run PI cycle
        env:
          PI_AUTONOMOUS_ENABLED: ${{ vars.PI_AUTONOMOUS_ENABLED }}
          PI_OBJECTIVE: ${{ inputs.objective }}
        run: |
          node pi/runner.mjs
