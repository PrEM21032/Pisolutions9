name: PI Chat Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/pi-chat-worker.yml'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install current Wrangler
        working-directory: worker
        run: npm install --no-save --no-package-lock wrangler@4
      - name: Test deterministic recovery
        working-directory: worker
        run: node src/deterministic-fallback-test.mjs
      - name: Deploy PI chat worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Live customer chat smoke test
        shell: bash
        run: |
          set -euo pipefail
          endpoint='https://pi-chat.premchandyadlapati.workers.dev/api/chat'
          answers=()
          sources=()
          for question in 'What is 2 plus 2?' 'Why is the sky blue?' 'Say hello in one short sentence.' 'Give me one unusual fact about Saturn in one sentence.'; do
            status="$(curl --silent --show-error --location --max-time 30 --retry 3 --retry-all-errors \
              -H 'content-type: application/json' \
              -H 'origin: https://pisolutions9.github.io' \
              -d "$(python -c 'import json,sys; print(json.dumps({"message":sys.argv[1]}))' "$question")" \
              --output /tmp/pi-chat.json --write-out '%{http_code}' "$endpoint")"
            echo "Chat HTTP status: $status"
            cat /tmp/pi-chat.json
            test "$status" = 200
            python -c 'import json; d=json.load(open("/tmp/pi-chat.json")); assert d.get("ok") is True and isinstance(d.get("answer"), str) and d["answer"].strip(); a=d["answer"].lower(); forbidden=("classification:","plan:","i recognized this as an informational question","i will answer directly when the required knowledge is available."); assert not any(x in a for x in forbidden)'
            answers+=("$(python -c 'import json; print(json.load(open("/tmp/pi-chat.json"))["answer"])')")
            sources+=("$(python -c 'import json; print(json.load(open("/tmp/pi-chat.json"))["source"])')")
          done
          test "${answers[0]}" != "${answers[1]}"
          test "${answers[1]}" != "${answers[2]}"
          test "${sources[3]}" != 'pi-chat-deterministic-recovery'
