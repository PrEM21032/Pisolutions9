name: PI Chat Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/pi-chat-worker.yml'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Deploy PI chat worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
      - name: Live customer chat smoke test
        shell: bash
        run: |
          set -euo pipefail
          endpoint='https://pi-chat.premchandyadlapati.workers.dev/api/chat'
          for question in 'What is 2 plus 2?' 'Why is the sky blue?'; do
            status="$(curl --silent --show-error --location --max-time 30 --retry 3 --retry-all-errors \
              -H 'content-type: application/json' \
              -H 'origin: https://pisolutions9.github.io' \
              -d "$(python -c 'import json,sys; print(json.dumps({"message":sys.argv[1]}))' "$question")" \
              --output /tmp/pi-chat.json --write-out '%{http_code}' "$endpoint")"
            echo "Chat HTTP status: $status"
            cat /tmp/pi-chat.json
            test "$status" = 200
            python -c 'import json; d=json.load(open("/tmp/pi-chat.json")); assert d.get("ok") is True and isinstance(d.get("answer"), str) and d["answer"].strip()'
          done
