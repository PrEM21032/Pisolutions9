name: PI Live Model Watch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  live-model-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Verify public customer path has a live model-backed response
        shell: bash
        run: |
          set -euo pipefail
          endpoint='https://pi-chat.premchandyadlapati.workers.dev/api/chat'
          live=0
          for question in \
            'What is 2 plus 2?' \
            'Explain opportunity cost in one sentence.' \
            'Give me one unusual fact about Saturn.'; do
            status="$(curl --silent --show-error --location --max-time 25 --retry 2 --retry-all-errors \
              -H 'content-type: application/json' \
              -H 'origin: https://pisolutions9.github.io' \
              -d "$(python -c 'import json,sys; print(json.dumps({"message":sys.argv[1]}))' "$question")" \
              --output /tmp/pi-watch.json --write-out '%{http_code}' "$endpoint")"
            echo "HTTP $status | $question"
            cat /tmp/pi-watch.json
            if [[ "$status" != 200 ]]; then continue; fi
            source="$(python -c 'import json; print(json.load(open("/tmp/pi-watch.json")).get("source", ""))')"
            if [[ "$source" != pi-chat-deterministic-recovery ]]; then live=$((live + 1)); fi
          done
          echo "Live model-backed responses: $live"
          test "$live" -ge 1
      - name: Record exact live-model evidence when newly verified
        shell: bash
        run: |
          set -euo pipefail
          marker='PI_LIVE_MODEL_READY.md'
          if [[ -f "$marker" ]] && grep -q "Verified commit: $GITHUB_SHA" "$marker"; then
            echo 'Live-model evidence already recorded for this exact commit.'
            exit 0
          fi
          cat > "$marker" <<EOF
# PI Live Model Verification

Verified commit: $GITHUB_SHA
Verified at: $(date -u '+%Y-%m-%dT%H:%M:%SZ')

The public customer chat path returned at least one genuine model-backed response from the live deployment. Deterministic recovery was not counted as success.
EOF
          git config user.name 'PI Release Watch'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$marker"
          git commit -m "chore: record live model verification"
          git push
