name: PI Runtime Test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PI_PUBLIC_URL: https://pi-lab-o019.netlify.app

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Full regression gate
        run: npm test
      - name: Live production HTTP smoke test
        run: |
          set -euo pipefail
          echo "Testing $PI_PUBLIC_URL/api/health"
          status="$(curl --silent --show-error --location --max-time 20 --retry 3 --retry-all-errors --output /tmp/pi-health.json --write-out '%{http_code}' "$PI_PUBLIC_URL/api/health")"
          echo "HTTP status: $status"
          cat /tmp/pi-health.json
          test "$status" -ge 200
          test "$status" -lt 300
          grep -Eiq '"(ok|healthy|status)"[[:space:]]*:[[:space:]]*(true|"ok"|"healthy"|"ready")' /tmp/pi-health.json
