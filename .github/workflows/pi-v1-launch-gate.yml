name: PI V1 Launch Gate

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pi-v1-launch-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  v1-launch-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: V1 gate
        run: npm run test:v1

      - name: Launch gate summary
        run: |
          echo "PI V1 code gate passed."
          echo "Production provider health is evaluated separately by the production smoke workflow."
