name: PI V1 Launch Gate

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pi-v1-launch-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  v1-launch-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact release candidate
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify release candidate identity
        run: |
          echo "Release candidate: $GITHUB_SHA"
          test -f PI_V1_RELEASE_REPORT.md
          test -f pi/team-manifest.mjs

      - name: V1 full regression gate
        run: npm run test:v1

      - name: V1 release evidence gate
        run: |
          echo "V1 code, runtime, recovery, tooling, customer UI, cloud, security and team gates passed for $GITHUB_SHA."
          echo "Live provider/customer deployment evidence must remain tied to this exact release candidate."
          echo "Deterministic recovery is not counted as live-model success."

      - name: Launch gate summary
        run: |
          echo "PI V1 launch gate completed for exact commit $GITHUB_SHA."
          echo "Promotion requires same-commit customer-path and deployment verification evidence."
