name: PI V1 Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PI_CHAT_URL: https://pi-chat.premchandyadlapati.workers.dev/api/chat

jobs:
  stress-customer-chat:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Full regression gate
        run: npm test
      - name: Deploy exact candidate worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm install --no-save --no-package-lock wrangler@4
          node src/deterministic-fallback-test.mjs
          npx wrangler deploy
      - name: Sequential customer reliability verification
        shell: bash
        run: |
          set -euo pipefail
          total=0
          while IFS= read -r question; do
            [ -z "$question" ] && continue
            total=$((total+1))
            response=$(curl --silent --show-error --fail-with-body --max-time 20 -H 'content-type: application/json' -H 'origin: https://prem21032.github.io' -d "{\"message\":\"$question\"}" "$PI_CHAT_URL")
            export response
            python - <<'PY'
          import json, os
          body=json.loads(os.environ['response'])
          answer=body.get('answer','')
          if body.get('ok') is not True or body.get('truth') != 'model-response':
              raise SystemExit('reliability gate: non-model response')
          if body.get('source') == 'pi-chat-deterministic-recovery':
              raise SystemExit('reliability gate: deterministic recovery')
          if not isinstance(answer,str) or len(answer.strip()) < 120:
              raise SystemExit('reliability gate: short answer')
          PY
          done <<'QUESTIONS'
          Explain a reliable migration plan for a production database.
          Compare availability reliability and security in a web service.
          Design an API boundary for a marketplace application.
          Explain how to validate a machine learning improvement.
          Create a practical product launch plan with acceptance tests.
          Diagnose a checkout system with latency and inventory errors.
          Explain the tradeoffs of cache consistency.
          Outline an incident response process for an outage.
          Explain how rate limits protect an API.
          Compare event driven and request response architectures.
          Design observability for a distributed service.
          Explain how to test a customer chat experience end to end.
          QUESTIONS
          test "$total" -eq 12
          echo "RELIABILITY_PASS requests=$total"
